<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Personal Finance Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 35px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #111827;
            color: #ffffff;

            font-size: 24px;
        }

        .logo h1 {
            margin: 0;
            font-size: 22px;
        }

        .logo p {
            margin: 8px 0 0;

            font-size: 13px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #64748b;

            box-shadow:
                0 0 0 3px
                rgba(100, 116, 139, 0.12);
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #111827;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .error {
            margin-bottom: 18px;

            padding: 11px 13px;

            border-radius: 8px;

            background: #fef2f2;
            color: #dc2626;

            font-size: 13px;
        }

        .footer {
            margin-top: 22px;

            text-align: center;

            font-size: 11px;
            color: #9ca3af;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <div class="logo-icon">
                ₹
            </div>

            <h1>
                Personal Finance Manager
            </h1>

            <p>
                Login to manage your finances
            </p>

        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/login"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <div class="footer">
            Personal Finance Manager
        </div>

    </div>

</div>

</body>

</html>
